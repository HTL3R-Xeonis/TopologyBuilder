[project]
name = "xeonis-topologybuilder"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "loguru",
    "networkx",
    "paramiko",
    "python-dotenv",
    "PyYAML",
    "requests",
    "typer",
    "pyvmomi"
]

[tool.ruff]
line-length = 120
lint.flake8-bugbear.extend-immutable-calls = ["typer.Option"]

[tool.pytest.ini_options]
python_functions = "*_[0-9][0-9][0-9]"
testpaths = [
    "tests"
]
markers = [
    "testlink: Custom metadata for TestLink-testcases"
]

[tool.deptry]
requirements_files = []