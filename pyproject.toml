[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topologybuilder"
version = "0.1.0"
description = "Builds and deploys network topologies to GNS3/ESXi from a YAML config file."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "loguru==0.7.3",
    "paramiko==5.0.0",
    "python-dotenv==1.2.3",
    "pyvmomi==9.1.0.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "typer==0.27.1",
    "urllib3==2.7.0",
]

[project.scripts]
# Points at main.main() rather than src.cli:app directly, so the
# console script goes through the same loguru file/console logging
# setup `python main.py` does - a raw src.cli:app entry point would
# silently skip logs/app.log and loguru's configured console format.
topologybuilder = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]
