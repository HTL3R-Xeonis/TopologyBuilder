name: Python CI (Ruff & Doctests)

on:
  push:
  pull_request:

# Read-only token; the pipeline needs nothing else (public repository).
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  doctests_and_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      # TESTS
      - name: Execute tests with pytest module
        env:
          PYTHONPATH: ${{ github.workspace }}
          LITERAL_API_VALUES: "true"
        run: |
          pip install pytest
          python -m pytest ./tests

      # LINTER
      - name: Ruff installieren
        run: pip install ruff

      - name: Ruff Check
        run: ruff check --output-format=github --target-version=py314 .

      - name: Ruff Format
        run: ruff format --output-format=github --diff --check --target-version=py314 .