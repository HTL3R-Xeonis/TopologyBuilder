# Default values for `topologybuilder` CLI options.
# Copy this file to topologybuilder.yml (kept out of git) to set your own defaults.
# CLI flags and environment variables always take precedence over this file.
# The ESXi password is intentionally not supported here - use --esxi-password,
# ESXI_PASSWORD, or the interactive prompt instead.

# Default topology config file for validate/build/deploy, if none is given
# as a command-line argument.
config_path: ./config_file_example.yml

# Default output path for `generate`.
output: ./config_file_example.yml

generator_url: http://10.20.20.172:8002
esxi_host: 10.20.20.201
esxi_username: root

# Name of the GNS3 project `deploy` creates/reuses. Defaults to the config
# file's name if omitted.
gns3_project: TopologyBuilder

# Only needed with `deploy --fresh-gns3-vm`:
gns3_ova_path: /mnt/nfs-share/gns3.ova
gns3_datastore: datastore1
gns3_mgmt_network: PG-MGMT

# ESXi port group carrying the GNS3 VM's VLAN trunk NIC. Required with
# --fresh-gns3-vm; also used on every deploy (with or without
# --fresh-gns3-vm) to ensure it accepts promiscuous mode/MAC changes/forged
# transmits, which GNS3's Cloud nodes need to bridge topology devices
# through it - without this, ESXi silently drops all bridged traffic.
gns3_trunk_network: PG-GNS3-TRUNK

# Name of the GNS3 VM's own guest-OS interface for that same trunk NIC -
# NOT the ESXi port group above, the interface name inside the VM itself.
# Auto-detected if omitted (excludes the management interface and known
# virtual interfaces; only auto-picks if exactly one candidate remains).
# Set this explicitly only if auto-detection is ambiguous on your GNS3 VM
# build - the error message lists the actual candidates in that case.
# gns3_trunk_interface: eth1

# Datastore to place newly provisioned topology VMs on. Only needed if the
# topology config has ESXi-hosted (role: VM) nodes.
esxi_datastore: datastore1

# Directory to stage downloaded node OVAs in before import. Defaults to the
# system temp dir, which may be too small for multi-gigabyte OVAs - point
# this at a larger volume (e.g. the same NFS mount used for gns3_ova_path)
# if you hit "No space left on device".
esxi_ova_cache_dir: /mnt/nfs-share
